# 每日自动生成 Profile SVG 资产（Stats 双卡 + Streak 卡片 + 贪吃蛇深浅双色动画）
# 并通过 peaceiris/actions-gh-pages 推送到独立的 output 分支，保持 main 分支提交历史干净。
name: Generate Profile Assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/generate-stats-cards.yml"
      - "card-engine/**"
  schedule:
    - cron: "30 0 * * *" # 每天 UTC 0:30（北京时间 8:30）自动更新
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

concurrency:
  group: generate-profile-assets
  cancel-in-progress: false

env:
  GH_USERNAME: ${{ github.repository_owner }}

jobs:
  generate:
    runs-on: ubuntu-latest
    name: build-profile-svgs
    steps:
      - name: Checkout profile repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install card-engine dependencies
        working-directory: card-engine
        run: npm ci

      - name: Start local card server
        working-directory: card-engine
        env:
          PORT: 9000
          PAT_1: ${{ secrets.CARDS_PAT || secrets.GITHUB_TOKEN }}
        run: |
          node express.js > server.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 30); do
            if curl -s -o /dev/null "http://127.0.0.1:9000/"; then
              echo "server ready"
              break
            fi
            sleep 1
          done

      - name: Render Tokyo Night stats & streak cards
        run: |
          mkdir -p dist
          base="http://127.0.0.1:9000"
          # 1. 综合数据概览卡（Tokyo Night + 冰川蓝 #38BDF8 + 隐藏外边框 + #0D1117 深色背景）
          curl -sf "${base}/api?username=${GH_USERNAME}&show_icons=true&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=38BDF8&icon_color=38BDF8" \
            -o dist/github-stats.svg
          # 2. 常用语言分布卡（Compact 紧凑布局 + Tokyo Night + 隐藏外边框 + #0D1117 深色背景）
          curl -sf "${base}/api/top-langs?username=${GH_USERNAME}&layout=compact&langs_count=8&theme=tokyonight&hide_border=true&bg_color=0D1117&title_color=38BDF8" \
            -o dist/top-langs.svg
          # 3. 连续提交记录卡（Streak Stats，Tokyo Night + 隐藏外边框 + #0D1117 深色背景）
          curl -sf "https://streak-stats.demolab.com?user=${GH_USERNAME}&theme=tokyonight&hide_border=true&background=0D1117&ring=38BDF8&fire=38BDF8&currStreakLabel=38BDF8" \
            -o dist/streak-stats.svg

      - name: Validate stats cards
        run: |
          set -e
          for f in dist/*.svg; do
            test -s "$f" || { echo "::error::$f is empty"; exit 1; }
            grep -q "<svg" "$f" || { echo "::error::$f is not SVG"; exit 1; }
            if grep -q "Something went wrong" "$f"; then
              echo "::error::$f contains an error card:"
              cat "$f"
              exit 1
            fi
          done
          echo "All stats cards OK"

      - name: Stop local server
        if: always()
        run: |
          [ -f card-engine/server.pid ] && kill "$(cat card-engine/server.pid)" 2>/dev/null || true

      - name: Generate GitHub contribution snake animations (Light & Dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Deploy SVG assets to isolated output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          force_orphan: true
          commit_message: "chore: update profile svg assets [skip ci]"
